[package]
name = "mycela-engine"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
description = "Mycela's procedural texture engine"

[lints]
workspace = true

[dependencies]
num-bigint = "=0.4.8"
naga = { version = "=29.0.4", features = ["wgsl-in"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
libm = "=0.2.16"
mycela-framework-math = { path = "../framework-math" }
image = { version = "=0.25.10", default-features = false, features = ["bmp", "jpeg"] }
mycela-jpeg = { path = "../jpeg" }
png = "=0.18.1"
roxmltree = "=0.21.1"
sha2 = "=0.10.9"
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0"
