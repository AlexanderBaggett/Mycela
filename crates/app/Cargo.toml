[package]
name = "mycela-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
texture-workspace-test = []

[dependencies]
gpui-kit = "=0.7.1"
mycela-engine = { path = "../engine" }
mycela-renderer = { path = "../renderer" }
pollster = "=0.4.0"
mycela-system-memory = { path = "../system-memory" }
# GPUI's actual Frame type for raster transfer, not another UI framework.
image = { version = "=0.25.10", default-features = false, features = ["bmp", "hdr", "jpeg", "png", "tga", "tiff"] }
chrono = "=0.4.45"
dirs = "=6.0.0"
async-channel = "=2.5.0"
sysinfo = { version = "=0.31.4", default-features = false, features = ["disk"] }
tempfile = "=3.27.0"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "file_chooser", "raw_handle", "wayland"] }
raw-window-handle = "=0.6.2"
url = "=2.5.8"

[dev-dependencies]
gpui-kit = { version = "=0.7.1", features = ["test-support"] }
# Include the legacy fixture in integration tests without exposing its window in the desktop build.
mycela-app = { path = ".", features = ["texture-workspace-test"] }
