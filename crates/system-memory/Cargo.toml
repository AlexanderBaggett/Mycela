[package]
name = "mycela-system-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# This crate owns the native memory-query boundary. The selected native
# modules opt into their documented FFI calls.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"
